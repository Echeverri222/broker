# Production-shaped stack on one machine (staging / local rehearsal): OPS-02, OPS-03, OPS-04, OPS-07.
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env up --build
# One image, three roles. Managed Postgres with PITR replaces `db` in a real deployment (set DATABASE_URL).
x-app: &app
  build: { context: ../backend }
  environment: &env
    RAILS_ENV: production
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
    DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/paper_broker_production
    CACHE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/paper_broker_production_cache
    QUEUE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/paper_broker_production_queue
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    RAILS_MAX_THREADS: "3"
    DB_POOL_LIMIT: ${DB_POOL_LIMIT:-95}
    WEB_PROCESSES: "2"
    SMTP_ADDRESS: ${SMTP_ADDRESS:-}
    MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
    COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    ASSUME_SSL: "false"
    FORCE_SSL: "false"

services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, timeout: 3s, retries: 20 }

  release:
    <<: *app
    command: bin/release
    restart: "no"
    depends_on: { db: { condition: service_healthy } }

  web:
    <<: *app
    command: bin/rails server -b 0.0.0.0 -p 3000
    depends_on: { release: { condition: service_completed_successfully } }

  worker:
    <<: *app
    command: bin/jobs
    depends_on: { release: { condition: service_completed_successfully } }

  proxy:
    build: { context: .., dockerfile: frontend/Dockerfile }
    environment: { API_UPSTREAM: "http://web:3000" }
    ports: ["8080:80"]
    depends_on: [web]

volumes:
  pgdata:
