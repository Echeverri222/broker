# One origin for SPA and API (OPS-02). API_UPSTREAM is substituted by the nginx image at start.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SEC-07: the SPA's own headers. API responses carry their own (default-src 'none').
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location = /up { proxy_pass ${API_UPSTREAM}; }
  location /up/deep { proxy_pass ${API_UPSTREAM}; }

  # Hashed assets are immutable; index.html is never cached so a deploy takes effect at once.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
