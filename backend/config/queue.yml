# JOB-01: three queues so a slow low-priority job can never delay a fill.
#   critical: order fills, on-demand and pre-open quote refreshes   (own workers)
#   default:  recurring quote refresh, snapshots, session cleanup
#   low:      market-data warming, ledger verification, cleanup     (own worker)
# JOB-05: counts are environment variables. Keep (all threads + web threads) within the DB pool (see OPS-05).
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: critical
      threads: <%= ENV.fetch("JOB_CRITICAL_THREADS", 2) %>
      processes: 1
      polling_interval: 0.5
    - queues: default
      threads: <%= ENV.fetch("JOB_DEFAULT_THREADS", 3) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    - queues: low
      threads: <%= ENV.fetch("JOB_LOW_THREADS", 1) %>
      processes: 1
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
