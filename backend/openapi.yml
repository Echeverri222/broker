---
openapi: 3.0.3
info:
  title: Paper Broker API
  version: 4.0.0
  description: "Contract for PRD v2, v3 (UI redesign data) and v4 (multi-user: sessions, account lifecycle, admin). Decimals are strings with a fixed scale."
servers:
- url: "/api/v1"
paths:
  "/signup":
    post:
      summary: Sign up
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/session":
    post:
      summary: Sign in
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
    delete:
      summary: Sign out
      responses:
        '204':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
  "/me":
    get:
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        default:
          "$ref": "#/components/responses/Error"
  "/market/status":
    get:
      summary: US market status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MarketStatus"
        default:
          "$ref": "#/components/responses/Error"
  "/market/overview":
    get:
      summary: Market strip (S&P 500, Nasdaq, Bitcoin) from cached quotes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        label:
                          type: string
                        price:
                          type: string
                          pattern: "^-?\\d+\\.\\d+$"
                        change_percent:
                          type: string
                          nullable: true
                        proxy_for:
                          type: string
                          nullable: true
                      additionalProperties: false
                      required:
                      - symbol
                      - label
                      - price
                      - change_percent
                      - proxy_for
                additionalProperties: false
                required:
                - items
        default:
          "$ref": "#/components/responses/Error"
  "/assets":
    get:
      summary: Search, filter and sort assets (cache only, never calls a provider)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AssetListItem"
                  meta:
                    "$ref": "#/components/schemas/AssetListMeta"
                additionalProperties: false
                required:
                - assets
                - meta
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - stock
          - etf
          - crypto
      - name: filter
        in: query
        required: false
        description: Comma list of watching, owned, gainers, losers, most_traded, near_high, under_50, open (all must match).
        schema:
          type: string
      - name: sector
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - change
          - price_asc
          - price_desc
          - name
          - volume
          - change_1m
      - name: page
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Page size, 1 to 50 (default 25).
        schema:
          type: string
  "/assets/{symbol}":
    get:
      summary: Asset detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AssetDetail"
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
  "/assets/{symbol}/candles":
    get:
      summary: Price history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  range:
                    type: string
                  interval:
                    type: string
                    enum:
                    - 5m
                    - 1h
                    - 1d
                    - 1w
                  candles:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Candle"
                additionalProperties: false
                required:
                - symbol
                - range
                - interval
                - candles
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
      - name: range
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1D
          - 1W
          - 1M
          - 3M
          - 6M
          - 1Y
          - 5Y
          - ALL
      - name: interval
        in: query
        required: false
        description: Candle size. Valid per range 1D:1h, 1W:1h|1d, 1M:1d, 3M|6M|1Y|5Y:1d|1w, ALL:1w; anything else is 422.
        schema:
          type: string
          enum:
          - 1h
          - 1d
          - 1w
  "/portfolio":
    get:
      summary: Portfolio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Portfolio"
        default:
          "$ref": "#/components/responses/Error"
  "/portfolio/history":
    get:
      summary: Value history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/History"
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: range
        in: query
        required: false
        schema:
          type: string
      - name: benchmark
        in: query
        required: false
        schema:
          type: string
  "/orders":
    get:
      summary: Order history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Order"
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
                additionalProperties: false
                required:
                - orders
                - page
                - per_page
                - total
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
      - name: side
        in: query
        required: false
        schema:
          type: string
      - name: symbol
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - filled
          - cancelled
          - rejected
      - name: limit
        in: query
        required: false
        description: Page size, 1 to 200 (default 25).
        schema:
          type: string
    post:
      summary: Place a market order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrderResponse"
        '201':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrderResponse"
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/deposits":
    get:
      summary: Deposit ledger
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposits:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Deposit"
                additionalProperties: false
                required:
                - deposits
        default:
          "$ref": "#/components/responses/Error"
    post:
      summary: Deposit virtual cash
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DepositResponse"
        '201':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DepositResponse"
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/watchlist":
    get:
      summary: Watchlist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Asset"
                additionalProperties: false
                required:
                - assets
        default:
          "$ref": "#/components/responses/Error"
    post:
      summary: Add to watchlist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Asset"
        '201':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Asset"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/watchlist/{symbol}":
    delete:
      summary: Remove from watchlist
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
  "/orders/{id}":
    delete:
      summary: Cancel a waiting order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    "$ref": "#/components/schemas/Order"
                  cash:
                    type: string
                    pattern: "^-?\\d+\\.\\d+$"
                  reserved_cash:
                    type: string
                    pattern: "^-?\\d+\\.\\d+$"
                additionalProperties: false
                required:
                - order
                - cash
                - reserved_cash
        default:
          "$ref": "#/components/responses/Error"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  "/account/reset":
    post:
      summary: Reset account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/sessions":
    get:
      summary: List my active sessions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionList"
        default:
          "$ref": "#/components/responses/Error"
    delete:
      summary: Sign out every other device
      responses:
        '204':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
  "/sessions/{id}":
    delete:
      summary: Revoke one of my sessions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
  "/password_reset":
    post:
      summary: Request a password reset email (always 202)
      responses:
        '202':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
    patch:
      summary: Set a new password with a reset token
      responses:
        '204':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/email_verification":
    post:
      summary: Resend the confirmation email
      responses:
        '202':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
    patch:
      summary: Confirm an email address with a token
      responses:
        '204':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/account/password":
    patch:
      summary: Change password
      responses:
        '204':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/account/preferences":
    patch:
      summary: Update notification preferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/account/export":
    get:
      summary: Export my own data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountExport"
        default:
          "$ref": "#/components/responses/Error"
  "/account":
    delete:
      summary: Delete (anonymise) my account
      responses:
        '204':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/admin/reauth":
    post:
      summary: Confirm password for admin tools
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminReauth"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/admin/users":
    get:
      summary: Find users
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminUserList"
        default:
          "$ref": "#/components/responses/Error"
  "/admin/users/{id}":
    get:
      summary: One user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminUser"
        default:
          "$ref": "#/components/responses/Error"
  "/admin/users/{id}/disable":
    post:
      summary: Disable a user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminUser"
        default:
          "$ref": "#/components/responses/Error"
  "/admin/users/{id}/enable":
    post:
      summary: Enable a user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminUser"
        default:
          "$ref": "#/components/responses/Error"
  "/admin/users/{id}/revoke_sessions":
    post:
      summary: Revoke all of a user's sessions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminUser"
        default:
          "$ref": "#/components/responses/Error"
  "/admin/users/{id}/password_reset":
    post:
      summary: Send a user a password reset email
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
  "/admin/settings":
    get:
      summary: Runtime settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminSettings"
        default:
          "$ref": "#/components/responses/Error"
    patch:
      summary: Change runtime settings (trading kill switch)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminSettings"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  "/admin/queues":
    get:
      summary: Queue depth and failed jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminQueues"
        default:
          "$ref": "#/components/responses/Error"
  "/admin/jobs/{id}/retry":
    post:
      summary: Retry a failed job
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
  "/admin/jobs/{id}":
    delete:
      summary: Discard a failed job
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No content
        default:
          "$ref": "#/components/responses/Error"
  "/admin/audit_events":
    get:
      summary: Recent audit events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminAuditEvents"
        default:
          "$ref": "#/components/responses/Error"
components:
  schemas:
    SessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              current:
                type: boolean
              user_agent:
                type: string
                nullable: true
              ip_address:
                type: string
                nullable: true
              created_at:
                type: string
              last_seen_at:
                type: string
              expires_at:
                type: string
            required:
            - id
            - current
            - created_at
            - last_seen_at
            - expires_at
      required:
      - sessions
    AccountExport:
      type: object
      properties:
        exported_at:
          type: string
        user:
          type: object
        deposits:
          type: array
          items:
            type: object
        orders:
          type: array
          items:
            type: object
        positions:
          type: array
          items:
            type: object
      required:
      - exported_at
      - user
      - deposits
      - orders
      - positions
    AdminReauth:
      type: object
      properties:
        reauthenticated_until:
          type: string
      required:
      - reauthenticated_until
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        verified:
          type: boolean
        admin:
          type: boolean
        disabled:
          type: boolean
        deleted:
          type: boolean
        created_at:
          type: string
        active_sessions:
          type: integer
        account:
          type: object
          nullable: true
      required:
      - id
      - email
      - disabled
    AdminUserList:
      type: object
      properties:
        users:
          type: array
          items:
            "$ref": "#/components/schemas/AdminUser"
      required:
      - users
    AdminSettings:
      type: object
      properties:
        trading_enabled:
          type: boolean
      required:
      - trading_enabled
    AdminQueues:
      type: object
      properties:
        available:
          type: boolean
        depth:
          type: object
          additionalProperties:
            type: integer
        oldest_ready_seconds:
          type: integer
          nullable: true
        failed:
          type: array
          items:
            type: object
      required:
      - available
      - depth
      - failed
    AdminAuditEvents:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
      required:
      - events
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - unauthenticated
              - not_found
              - validation_failed
              - insufficient_funds
              - insufficient_quantity
              - order_not_pending
              - too_many_pending_orders
              - below_minimum
              - market_closed
              - idempotency_conflict
              - idempotency_key_required
              - unsupported_media_type
              - rate_limited
              - price_unavailable
              - internal
              - account_disabled
              - forbidden
              - invalid_token
              - trading_paused
              - reauth_required
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          additionalProperties: false
          required:
          - code
          - message
      additionalProperties: false
      required:
      - error
    Quote:
      type: object
      properties:
        price:
          type: string
          pattern: "^-?\\d+\\.\\d+$"
        previous_close:
          type: string
          pattern: "^-?\\d+\\.\\d+$"
          nullable: true
        change:
          type: string
          pattern: "^-?\\d+\\.\\d+$"
        change_percent:
          type: string
          pattern: "^-?\\d+\\.\\d+$"
        as_of:
          type: string
          format: date-time
        fetched_at:
          type: string
          format: date-time
        stale:
          type: boolean
      additionalProperties: false
      required:
      - price
      - previous_close
      - change
      - change_percent
      - as_of
      - fetched_at
      - stale
    Asset:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - stock
          - etf
          - crypto
        sector:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        quote:
          allOf:
          - "$ref": "#/components/schemas/Quote"
          nullable: true
      additionalProperties: false
      required:
      - symbol
      - name
      - kind
      - sector
      - logo_url
      - quote
    AssetListItem:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - stock
          - etf
          - crypto
        sector:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        quote:
          allOf:
          - "$ref": "#/components/schemas/Quote"
          nullable: true
        watched:
          type: boolean
        change_percent:
          type: string
          nullable: true
        week52_position:
          type: string
          pattern: "^[01]\\.\\d{4}$"
