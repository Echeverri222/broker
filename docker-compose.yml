# One command: docker compose up --build   ->  http://localhost:5173
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    command: bin/docker-entrypoint-dev
    environment: &backend_env
      DATABASE_HOST: db
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      SNAPSHOT_SCHEDULE: ${SNAPSHOT_SCHEDULE:-every 5 minutes}
      STARTING_CASH: "100000"
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/up"]
      interval: 5s
      timeout: 3s
      retries: 40

  worker:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    command: bin/jobs
    environment: *backend_env
    volumes:
      - ./backend:/app
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      API_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  node_modules:
